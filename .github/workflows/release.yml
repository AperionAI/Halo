name: Release

on:
  push:
    tags:
      - "halo-v*"
  # Lets a release be re-run against an existing tag (e.g. after a workflow
  # fix) without having to cut a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing halo-v* tag to build/publish against"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single source of truth for "which tag are we building", so push and
  # workflow_dispatch triggers behave identically everywhere below --
  # checkout ref, release tag_name, mirror's gh calls, and Docker tags all
  # read from here instead of the ambient (and dispatch-inconsistent)
  # github.ref_name / GITHUB_REF_NAME.
  resolve:
    name: resolve target tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - id: r
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#halo-v}" >> "$GITHUB_OUTPUT"

  binaries:
    name: ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          # Both Mac targets build on the same arm64 (Apple Silicon) runner --
          # Xcode's cc/ld64 cross-compiles x86_64-apple-darwin natively, no
          # Rosetta or extra linker needed. macos-13 (Intel) hosted runners
          # have been hitting multi-hour/indefinite queue times; macos-14
          # queues in ~seconds.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin halo --bin halo-relay

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DIST="halo-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/halo" "$DIST/"
          cp "target/${{ matrix.target }}/release/halo-relay" "$DIST/"
          cp README.md LICENSE config/halo.example.yaml "$DIST/"
          tar -czf "${DIST}.tar.gz" "$DIST"
          shasum -a 256 "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Dist = "halo-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $Dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/halo.exe" $Dist
          Copy-Item "target/${{ matrix.target }}/release/halo-relay.exe" $Dist
          Copy-Item README.md,LICENSE,config/halo.example.yaml $Dist
          Compress-Archive -Path $Dist -DestinationPath "$Dist.zip"
          (Get-FileHash "$Dist.zip" -Algorithm SHA256).Hash.ToLower() | Out-File "$Dist.zip.sha256"

      # Upload as a build artifact rather than calling action-gh-release here:
      # 5 matrix jobs hitting the same release concurrently causes "too many
      # retries" API races. A single downstream `publish` job does the one
      # real upload after every target has finished building.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ matrix.target }}
          path: |
            halo-${{ matrix.target }}.tar.gz
            halo-${{ matrix.target }}.tar.gz.sha256
            halo-${{ matrix.target }}.zip
            halo-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  publish:
    name: publish binaries to GitHub Release
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false

  mirror:
    name: mirror binaries to public dist repo
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # No-op until you set the HALO_DIST_REPO repo variable (owner/name of a
    # PUBLIC, source-free releases repo) and the HALO_DIST_TOKEN secret (a PAT
    # or fine-grained token with `contents: write` on that dist repo).
    if: ${{ vars.HALO_DIST_REPO != '' }}
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Download release assets from this (private) repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cd dist
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'halo-*'
          ls -l

      - name: Publish to public dist repo
        env:
          GH_TOKEN: ${{ secrets.HALO_DIST_TOKEN }}
          DIST_REPO: ${{ vars.HALO_DIST_REPO }}
        run: |
          cd dist
          # Create the release in the public repo (tag is created against its
          # default branch); fall back to uploading if it already exists.
          if ! gh release create "$TAG" ./* \
                --repo "${DIST_REPO}" \
                --title "$TAG" \
                --notes "Prebuilt Halo binaries for $TAG. Source is closed; see https://halo-get.aperion.ai to install."; then
            gh release upload "$TAG" ./* \
              --repo "${DIST_REPO}" --clobber
          fi

  docker:
    name: docker (GHCR)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
