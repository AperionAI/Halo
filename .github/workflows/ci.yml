name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for both jobs below (checkout only, no write access).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  windows:
    name: windows build · test (keyring parity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # Compiles the `keyring` Windows Credential Manager backend and runs the
      # non-interactive suite. NOTE: this validates compilation + logic on
      # Windows, NOT interactive Credential Manager persistence in a headless
      # service context -- see docs/WINDOWS_VERIFICATION.md for the manual
      # checks still required before claiming Windows parity in marketing.
      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace
