[package]
name = "halo-relay"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
description = "Smartflow Halo relay -- minimal telemetry ingest + savings dashboard. One axum binary backed by a single SQLite file. Receives metadata only; model traffic never transits the relay."

[[bin]]
name = "halo-relay"
path = "src/main.rs"

[dependencies]
# See halo-shim/Cargo.toml for why `version` is required alongside `path`.
halo-common = { path = "../halo-common", version = "1.5.0" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

axum = "0.7"
# Single-file SQLite via rusqlite with the bundled amalgamation so there's no
# system libsqlite3 dependency to install. Zero-ops at v1 scale.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
