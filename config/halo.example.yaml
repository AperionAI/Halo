# Smartflow Halo shim configuration.
#
# Copy to ~/.halo/config.yaml (or set $HALO_HOME to relocate the base dir).
# Every field is optional; the defaults below are what Halo uses when the file
# is absent. Real provider keys are NEVER stored here -- they live in your OS
# keychain (see `halo agent add`).

# Loopback address the LLM-API ingress binds to. Keep it on 127.0.0.1 unless
# you deliberately want other machines to reach the proxy.
listen: "127.0.0.1:8787"

# Minimal hosted relay for the savings dashboard. Omit both to run fully local
# (budgets, cache, and `halo report` all still work offline).
# relay_url: "https://halo-relay.example.com"
# relay_token: "paste-the-device-token-issued-at-registration"

budget:
  # Rolling window the caps apply over.
  window_hours: 24
  # Global caps across all agents. soft = warn but keep serving; hard = the
  # kill switch (refuse locally, always, even if the relay was never up).
  soft_cap_usd: 50.0
  hard_cap_usd: 100.0
  # Optional per-agent overrides (win over the global caps for that agent).
  per_agent:
    - agent_id: "researcher"
      soft_cap_usd: 10.0
      hard_cap_usd: 20.0

cache:
  enabled: true
  # Hard cap on stored entries -- enforced from day one, not bolted on later.
  max_entries: 10000

# The semantic (embedding-similarity) cache: reuse an answer for a prompt
# that's SIMILAR but not identical -- including across providers/models, so
# an answer first generated by Anthropic can serve a later, semantically
# similar request routed to OpenAI (and vice versa). OFF by default: unlike
# every other cache in Halo this one spends real (if tiny) money on every
# lookup and every store, since it calls an embeddings API.
#
# Turning it on:
#   1. `halo embeddings set-key` (skip for provider: ollama or mock)
#   2. semantic_cache.enabled: true
#
# What it will and won't match, by design:
#   * Single-shot questions only (one user turn, no prior assistant/tool
#     history) -- multi-turn semantic matching needs the whole conversation
#     embedded and a higher safety bar; not in v1.1.
#   * Never a request using `tools`/`functions`, or `response_format` other
#     than plain text -- a similar-but-different prompt might need a
#     different tool call or a JSON shape the cached answer doesn't have.
#   * The system prompt must match exactly (same persona/task), but the
#     model and provider are deliberately NOT part of the match key -- that's
#     what makes cross-provider reuse possible.
#   * Every candidate is cosine-re-checked against the live query at request
#     time; a coarse keyword partition only narrows the search, it never
#     decides a hit by itself.
semantic_cache:
  enabled: false
  # "openai" | "ollama" | "mock". Always an API call -- Halo never loads or
  # runs an embedding model itself, even for "ollama" (that talks to your own
  # already-running server; Halo doesn't start it).
  provider: "openai"
  model: "text-embedding-3-small"
  # base_url: "http://localhost:11434"   # required for provider: ollama
  # Minimum cosine similarity to serve a candidate. A false-positive semantic
  # hit is a wrong answer served silently, so this errs conservative.
  similarity_threshold: 0.93
  max_entries: 2000

compression:
  # Safe, meaning-preserving multi-word reductions. On by default.
  verbose_phrases: true
  # Collapse 3+ blank lines to 2 and strip trailing line whitespace. Never
  # touches leading whitespace/indentation (safe for pasted code/YAML/lists).
  # On by default -- meaning cannot change either way.
  whitespace: true
  # Aggressive single-word/symbol abbreviations (e.g. "and" -> "&"). These can
  # change meaning, so they are strictly opt-in.
  aggressive_abbreviations: false
  # Inject Anthropic cache_control breakpoints on:
  #   * the system prompt,
  #   * the `tools` definitions (often the largest, most stable block),
  #   * the first message's attachment-shaped content (a pasted document,
  #     screenshot, or RAG context block that precedes the per-turn question).
  # Each fires when the block is either large on its own (>=4000 chars) or
  # smaller-but-seen 3+ times this process (>=2000 chars) -- same heuristic
  # as the main Smartflow proxy's `prompt_cache_injector.rs`, extended to
  # cover tools/attachments, which it doesn't. This is pure request-shaping;
  # OpenAI caches automatically and needs no injection. No effect unless the
  # served model actually honors Anthropic prompt caching.
  anthropic_cache_control: true

# MCP servers Halo fronts. Point your agent runtime's MCP config at Halo
# (e.g. http://127.0.0.1:8787/mcp/<name>) instead of these servers directly.
# Halo runs each server internally and applies Shield's cloak + taint at the
# seam. Register secrets with `aperion-shield` and reference them in tool args
# as {{cloak:NAME}}; Halo resolves them only on the copy sent upstream.
mcp_servers:
  - name: "postgres"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-postgres", "postgresql://localhost/mydb"]
    env: {}

# The built-in price table is a small, hand-maintained approximation (unlike
# LiteLLM's continuously-refreshed price file) and falls back to a mid-tier
# guess for models it doesn't recognize. That's fine most of the time, but
# it matters a lot for a budget/kill-switch product -- override anything it
# gets wrong here. `model` is substring-matched the same way as the built-in
# table (longest match wins).
# price_overrides:
#   - model: "gpt-4o-mini"
#     input_per_mtok: 0.15
#     output_per_mtok: 0.60
#     cached_input_per_mtok: 0.075
